<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>有人说，系统框架下，洪磊判了，番茄就完了！</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0a0a0a;
            font-family: 'Arial Black', sans-serif;
            overflow: hidden;
        }

        @keyframes shake-hard {
            0% { transform: scale(1.15) translate(0); }
            25% { transform: scale(1.15) translate(-8px, 4px); }
            50% { transform: scale(1.15) translate(8px, -4px); }
            75% { transform: scale(1.15) translate(-4px, -8px); }
            100% { transform: scale(1.15) translate(4px, 8px); }
        }

        @keyframes break-apart {
            0% {
                transform: scale(1.15) translate(0);
                opacity: 1;
                filter: blur(0);
            }
            50% {
                transform: scale(1.3) translate(20px, -10px);
                opacity: 0.8;
                filter: blur(2px);
            }
            100% {
                transform: scale(0.5) translate(100px, 50px) rotate(15deg);
                opacity: 0;
                filter: blur(10px);
            }
        }

        @keyframes rebuild {
            0% {
                transform: scale(0.5) translate(-100px, -50px) rotate(-15deg);
                opacity: 0;
                filter: blur(10px);
            }
            50% {
                transform: scale(1.2) translate(-10px, 5px);
                opacity: 0.7;
                filter: blur(3px);
            }
            100% {
                transform: scale(1) translate(0) rotate(0);
                opacity: 1;
                filter: blur(0);
            }
        }

        .scanline {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                transparent 50%,
                rgba(0, 0, 0, 0.1) 50%
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 10;
        }

        .noise {
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: transparent url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23n)" opacity="0.08"/></svg>');
            animation: noise 0.5s infinite;
            pointer-events: none;
            z-index: 9;
        }

        @keyframes noise {
            0% { transform: translate(0, 0); }
            10% { transform: translate(-5%, -5%); }
            20% { transform: translate(-10%, 5%); }
            30% { transform: translate(5%, -10%); }
            40% { transform: translate(-5%, 15%); }
            50% { transform: translate(-10%, 5%); }
            60% { transform: translate(15%, 0); }
            70% { transform: translate(0, 10%); }
            80% { transform: translate(-15%, 0); }
            90% { transform: translate(10%, 5%); }
            100% { transform: translate(5%, 0); }
        }

        .counter {
            position: fixed;
            top: 30px;
            right: 40px;
            color: #ff3333;
            font-size: 24px;
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
            z-index: 20;
            text-shadow: 0 0 10px rgba(255, 51, 51, 0.6);
        }

        .counter.pop {
            animation: pop 0.3s ease-out;
        }

        .donate-link {
            position: fixed;
            bottom: 30px;
            right: 40px;
            padding: 14px 24px;
            background: linear-gradient(135deg, #ff3366, #ff9933);
            color: #ffffff;
            font-size: 18px;
            font-weight: 700;
            text-decoration: none;
            border-radius: 999px;
            box-shadow: 0 10px 30px rgba(255, 102, 51, 0.35);
            z-index: 20;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .donate-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 36px rgba(255, 102, 51, 0.5);
        }

        /* Alipay modal */
        .donate-modal {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.6);
            z-index: 30;
        }

        .donate-modal.show {
            display: flex;
        }

        .donate-card {
            background: #0f0f0f;
            padding: 22px;
            border-radius: 12px;
            color: #fff;
            min-width: 300px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.04);
        }

        .donate-card h3 {
            margin-bottom: 12px;
            font-size: 20px;
        }

        .donate-account {
            font-family: 'Courier New', monospace;
            background: rgba(255,255,255,0.03);
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 12px;
            word-break: break-all;
        }

        .donate-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn {
            padding: 10px 14px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            border: none;
        }

        .btn.primary { background: linear-gradient(90deg,#ff3366,#ff9933); color: #fff; }
        .btn.ghost { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.08); }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.5); color: #fff; }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="glitch" id="glitch">FAKE NEWS</div>
    <a class="donate-link" href="#" id="donateBtn">捐助我们</a>
    <div class="counter" id="counter">CLICKS: 0</div>
    <div class="scanline"></div>
    <div class="noise"></div>

    <div class="donate-modal" id="donateModal" aria-hidden="true">
        <div class="donate-card" role="dialog" aria-modal="true" aria-labelledby="donateTitle">
            <h3 id="donateTitle">捐助（支付宝）</h3>
            <div class="donate-account" id="donateAccount">19565150453</div>
            <div style="font-size:13px;color:#ccc;margin-bottom:10px">可在支付宝中粘贴账号或扫描对应二维码（若有）。</div>
            <img id="donateQr" alt="支付宝二维码" style="width:220px;height:220px;border-radius:8px;margin:8px auto;display:block;background:#fff;padding:8px;" src="" />
            <div style="font-size:12px;color:#bbb;margin-bottom:8px">长按或下载二维码在支付宝中打开进行支付。</div>
            <div class="donate-actions">
                <button class="btn primary" id="copyBtn">复制账号</button>
                <a class="btn ghost" id="downloadQr" href="#" download="alipay_qr.png">下载二维码</a>
                <button class="btn ghost" id="openAlipayBtn">打开支付宝</button>
                <button class="btn ghost" id="closeDonateBtn">关闭</button>
            </div>
        </div>
    </div>

    <script>
        const glitch = document.getElementById('glitch');
        const counter = document.getElementById('counter');
        let clickCount = 0;
        let isAnimating = false;

        glitch.addEventListener('click', function() {
            if (isAnimating) return;
            isAnimating = true;

            // 计数器+1
            clickCount++;
            counter.textContent = `CLICKS: ${clickCount}`;
            counter.classList.remove('pop');
            void counter.offsetWidth; // 强制重排触发动画
            counter.classList.add('pop');

            // 炸开
            this.classList.remove('rebuilding');
            this.classList.add('broken');

            // 重组
            setTimeout(() => {
                this.classList.remove('broken');
                this.classList.add('rebuilding');
            }, 600);

            // 恢复正常
            setTimeout(() => {
                this.classList.remove('rebuilding');
                isAnimating = false;
            }, 1400);
        });

            // Alipay donate modal logic
            const donateBtn = document.getElementById('donateBtn');
            const donateModal = document.getElementById('donateModal');
            const donateAccount = document.getElementById('donateAccount');
            const copyBtn = document.getElementById('copyBtn');
            const openAlipayBtn = document.getElementById('openAlipayBtn');
            const closeDonateBtn = document.getElementById('closeDonateBtn');

            let ALIPAY_ACCOUNT = '19565150453';
            let ALIPAY_LINK = '';

            const donateQr = document.getElementById('donateQr');
            const downloadQr = document.getElementById('downloadQr');

            // 从 donate.json 同步配置（用于与网站保持一致）
            fetch('donate.json', { cache: 'no-cache' })
                .then(r => r.json())
                .then(cfg => {
                    if (cfg.account) ALIPAY_ACCOUNT = cfg.account;
                    if (cfg.link) ALIPAY_LINK = cfg.link;
                })
                .catch(() => {});

            donateBtn.addEventListener('click', (e) => {
                e.preventDefault();
                donateAccount.textContent = ALIPAY_ACCOUNT;
                // generate QR image locally (no external requests)
                const tempDiv = document.createElement('div');
                tempDiv.style.position = 'fixed';
                tempDiv.style.left = '-9999px';
                document.body.appendChild(tempDiv);
                const qrPayload = ALIPAY_LINK || ALIPAY_ACCOUNT;
                const qrcode = new QRCode(tempDiv, { text: qrPayload, width: 400, height: 400, colorDark: '#000000', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.H });
                // allow render then extract data URL
                setTimeout(() => {
                    const img = tempDiv.querySelector('img');
                    const canvas = tempDiv.querySelector('canvas');
                    let dataUrl = '';
                    if (img && img.src) dataUrl = img.src;
                    else if (canvas) dataUrl = canvas.toDataURL('image/png');
                    else {
                        // fallback: create simple SVG with account text (not a QR)
                        const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='400' height='400'><rect width='100%' height='100%' fill='#fff'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' font-size='20' fill='#000'>${qrPayload}</text></svg>`;
                        dataUrl = 'data:image/svg+xml;base64,' + btoa(svg);
                    }
                    donateQr.src = dataUrl;
                    downloadQr.href = dataUrl;
                    document.body.removeChild(tempDiv);
                }, 60);
                donateModal.classList.add('show');
                donateModal.setAttribute('aria-hidden','false');
            });

            closeDonateBtn.addEventListener('click', () => {
                donateModal.classList.remove('show');
                donateModal.setAttribute('aria-hidden','true');
            });

            copyBtn.addEventListener('click', async () => {
                try {
                    await navigator.clipboard.writeText(ALIPAY_ACCOUNT);
                    copyBtn.textContent = '已复制';
                    setTimeout(() => copyBtn.textContent = '复制账号', 2000);
                } catch (err) {
                    alert('复制失败，请手动复制账号：' + ALIPAY_ACCOUNT);
                }
            });

            openAlipayBtn.addEventListener('click', () => {
                // 如果配置了可跳转的支付宝链接，则直接打开；否则尝试打开支付宝 App URI 作为兜底
                if (ALIPAY_LINK) {
                    window.location.href = ALIPAY_LINK;
                    return;
                }
                const alipayUri = 'alipay://platformapi/startapp';
                window.location.href = alipayUri;
                setTimeout(() => {
                    alert('如果未打开支付宝，请在支付宝中手动转账至账号：' + ALIPAY_ACCOUNT);
                }, 1200);
            });
